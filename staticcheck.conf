# staticcheck configuration for git-audit.
#
# "inherit" keeps staticcheck's own default set — which already leaves out the stylecheck rules
# about package comments and naming — and removes only the two that contradict the house style
# on purpose:
#
#   S1002  "should omit comparison to bool constant". The codebase compares explicitly
#          (`true == ok`, `false == ok`) precisely so a negation cannot be lost in a diff; the
#          `!` operator is not used anywhere.
#   ST1017 "don't use Yoda conditions". Yoda comparisons are the house rule, so that an
#          assignment can never be typed where a comparison was meant.
#
# Nothing else is silenced. staticcheck does not check formatting, so the four-space indentation
# this repository uses instead of gofmt tabs is untouched by it.
checks = ["inherit", "-S1002", "-ST1017"]
